<style>
/* Brand fonts, embedded so the tool works offline and makes no outside requests. */
@font-face { font-family: 'Recoleta'; font-weight: 400; font-style: normal; font-display: swap;
  src: url('https://simplecreatorco.myshopify.com/cdn/shop/t/4/assets/recoleta-regular.woff2?v=21253715987913751891789045526') format('woff2'); }
:root {
  --dusty: #889CA2;
  --yellow: #F3B548;
  --coral: #F49C8E;
  --text: #555555;
  --white: #FFFFFF;
  --gray: #F2F2F2;
  --mint: #EEF6F1;
  --slate: #5E7278;
  --line: #DFE6E8;
  --display: 'Recoleta', 'Fraunces', Georgia, serif;
  --label: 'Quicksand', Helvetica, Arial, sans-serif;
  --body: 'Nunito', Helvetica, Arial, sans-serif;
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--gray); color: var(--text);
  font-family: var(--body); font-size: 16px; line-height: 1.7;
  -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
}
h1, h2, h3, p, ol, ul { margin: 0; padding: 0; }
ol, ul { list-style: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
a { color: inherit; }
[hidden] { display: none !important; }
:focus { outline: none; }
:focus-visible { outline: 2px solid var(--slate); outline-offset: 3px; }
h1:focus, h1:focus-visible { outline: none; }

.shell {
  min-height: 100vh; min-height: 100dvh;
  display: flex; flex-direction: column; align-items: center;
  padding: 20px 16px calc(28px + env(safe-area-inset-bottom));
}
.shell--center { justify-content: center; }
.col { width: 100%; max-width: 600px; }
.col--wide { max-width: 720px; }

.eyebrow {
  font-family: var(--label); font-weight: 700; font-size: 11px; line-height: 1.5;
  letter-spacing: 3px; text-transform: uppercase; color: var(--coral);
}
.eyebrow--slate { color: var(--slate); }

.card {
  background: var(--white); border: 1px solid var(--line); border-radius: 18px;
  padding: 28px 22px;
}

.btn {
  display: inline-flex; align-items: center; justify-content: center; text-align: center;
  background: var(--yellow); color: #fff; text-decoration: none;
  font-family: var(--label); font-weight: 700; font-size: 12px; line-height: 1.4;
  letter-spacing: 3px; text-transform: uppercase;
  padding: 17px 30px; border-radius: 50px; min-height: 52px;
}
.btn:hover { background: #EFAC35; }
.pill {
  display: inline-flex; align-items: center; justify-content: center; text-align: center;
  background: var(--white); color: var(--dusty); border: 1px solid var(--dusty); text-decoration: none;
  font-family: var(--label); font-weight: 700; font-size: 12px; line-height: 1.4;
  letter-spacing: 2px; text-transform: uppercase;
  padding: 14px 24px; border-radius: 50px; min-height: 48px;
}
.pill:hover { background: #F7F9F9; }

/* ---------- Start ---------- */
.start { text-align: center; padding: 44px 24px 36px; }
.start h1 {
  font-family: var(--display); font-weight: 400; color: var(--dusty);
  font-size: clamp(40px, 11vw, 56px); line-height: 1.08; margin: 14px 0 22px;
}
.start p { max-width: 400px; margin: 0 auto; }
.start p + p { margin-top: 12px; }
.start .btn { width: 100%; max-width: 340px; margin-top: 28px; }
.start .fine { font-size: 14px; color: var(--dusty); margin-top: 16px; }
.areas { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 8px; margin: 26px auto 0; max-width: 420px; }
.areas li {
  font-family: var(--label); font-weight: 700; font-size: 11px; letter-spacing: 2px; text-transform: uppercase;
  color: var(--dusty); border: 1px solid var(--line); border-radius: 50px; padding: 6px 12px; line-height: 1.4;
}

/* ---------- Quiz ---------- */
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 2px 2px 12px; }
.topbar .name { font-family: var(--display); font-size: 17px; color: var(--dusty); line-height: 1.2; }
.count { font-family: var(--label); font-weight: 700; font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: var(--slate); white-space: nowrap; }
.track { height: 6px; background: var(--line); border-radius: 6px; overflow: hidden; margin-bottom: 16px; }
.track i { display: block; height: 100%; width: 0; background: var(--dusty); border-radius: 6px; transition: width .35s ease; }

.q { padding: 28px 20px 22px; }
.q h1 {
  font-family: var(--display); font-weight: 400; color: var(--dusty);
  font-size: clamp(26px, 7vw, 32px); line-height: 1.2; margin: 10px 0 0;
}
.q .help { font-size: 15px; line-height: 1.6; margin-top: 10px; }
.opts { margin-top: 22px; display: grid; gap: 10px; }
.opt {
  display: flex; align-items: flex-start; gap: 14px; width: 100%; text-align: left;
  background: var(--white); border: 1px solid var(--line); border-radius: 14px;
  padding: 16px 16px; font-size: 16px; line-height: 1.45; color: var(--text);
  min-height: 58px; transition: border-color .15s ease, background-color .15s ease;
}
.opt .dot {
  flex: none; width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--dusty);
  margin-top: 1px; display: grid; place-items: center; background: var(--white);
}
.opt .dot::after { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--dusty); transform: scale(0); transition: transform .15s ease; }
.opt:hover { border-color: var(--dusty); }
.opt[aria-pressed="true"] { border-color: var(--dusty); box-shadow: inset 0 0 0 1px var(--dusty); background: #F7F9F9; }
.opt[aria-pressed="true"] .dot::after { transform: scale(1); }
.qnav { display: flex; align-items: center; justify-content: space-between; margin-top: 18px; min-height: 44px; }
.textbtn {
  font-family: var(--label); font-weight: 700; font-size: 12px; letter-spacing: 2px; text-transform: uppercase;
  color: var(--dusty); padding: 12px 6px; min-height: 44px;
}
.textbtn:hover { color: var(--slate); }
.fade { animation: fade .28s ease both; }
@keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* ---------- Results ---------- */
.results { display: grid; gap: 14px; }
.rhead { text-align: center; padding: 36px 22px 30px; }
.rhead h1 {
  font-family: var(--display); font-weight: 400; color: var(--dusty);
  font-size: clamp(34px, 9vw, 46px); line-height: 1.12; margin: 12px 0 14px;
}
.rhead p { max-width: 500px; margin: 0 auto; }
.rhead p + p { margin-top: 10px; }

.h2 { font-family: var(--display); font-weight: 400; color: var(--dusty); font-size: clamp(24px, 6.4vw, 30px); line-height: 1.22; }
.sub { font-size: 15px; line-height: 1.6; margin-top: 6px; }

/* the path */
.path { margin-top: 22px; position: relative; }
.path li { position: relative; display: grid; grid-template-columns: 30px 1fr; column-gap: 14px; padding-bottom: 20px; }
.path li:last-child { padding-bottom: 0; }
.path li::before { content: ""; position: absolute; left: 14px; top: 30px; bottom: 0; width: 2px; background: var(--line); }
.path li:last-child::before { display: none; }
.node {
  width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center;
  background: var(--white); border: 2px solid var(--dusty); color: var(--dusty); position: relative; z-index: 1;
}
.node svg { width: 14px; height: 14px; display: block; }
.node--leak { background: var(--coral); border-color: var(--coral); color: #fff; }
.stop { min-width: 0; }
.stop .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 30px; }
.stop .area { font-family: var(--label); font-weight: 700; font-size: 12px; letter-spacing: 2px; text-transform: uppercase; color: var(--text); line-height: 1.4; }
.level { display: inline-flex; align-items: center; gap: 8px; flex: none; }
.level .word { font-family: var(--label); font-weight: 700; font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: var(--slate); white-space: nowrap; }
.meter { display: inline-flex; gap: 3px; }
.meter i { width: 14px; height: 6px; border-radius: 3px; background: var(--line); }
.meter i.on { background: var(--dusty); }
.stop .what { font-size: 15px; line-height: 1.5; margin-top: 1px; }

/* bottleneck cards */
.fix { padding: 28px 22px 22px; }
.fix .h2 { margin-top: 8px; }
.told { background: var(--gray); border-radius: 14px; padding: 16px 18px; margin-top: 18px; }
.told ul { margin-top: 8px; display: grid; gap: 6px; }
.told li { position: relative; padding-left: 16px; font-size: 15px; line-height: 1.5; }
.told li::before { content: ""; position: absolute; left: 0; top: .62em; width: 6px; height: 6px; border-radius: 50%; background: var(--dusty); }
.prose { margin-top: 18px; }
.prose p + p { margin-top: 12px; }
.h3 { font-family: var(--display); font-weight: 400; color: var(--dusty); font-size: 21px; line-height: 1.3; margin-top: 24px; }
.steps { counter-reset: s; margin-top: 12px; display: grid; gap: 12px; }
.steps li { counter-increment: s; position: relative; padding-left: 42px; min-height: 30px; line-height: 1.6; }
.steps li::before {
  content: counter(s); position: absolute; left: 0; top: -1px; width: 30px; height: 30px; border-radius: 50%;
  border: 1px solid var(--dusty); color: var(--dusty); font-family: var(--display); font-size: 16px; line-height: 28px; text-align: center;
}
.bundle { background: var(--mint); border-radius: 14px; padding: 18px 18px 20px; margin-top: 24px; }
.bundle ul { margin-top: 4px; }
.bundle li { padding: 12px 0; border-bottom: 1px solid #DCE9E1; }
.bundle li:last-child { border-bottom: 0; padding-bottom: 0; }
.bundle .open { font-family: var(--display); font-size: 20px; line-height: 1.3; color: var(--slate); }
.bundle .use { font-size: 15px; line-height: 1.55; margin-top: 3px; }
.bundle .pill { margin-top: 12px; background: transparent; border-color: var(--slate); color: var(--slate); }
.bundle .pill:hover { background: #E4F0E9; }

.tighten { padding: 26px 22px; }
.tighten ul { margin-top: 12px; display: grid; gap: 10px; }
.tighten li { position: relative; padding-left: 16px; line-height: 1.55; }
.tighten li::before { content: ""; position: absolute; left: 0; top: .66em; width: 6px; height: 6px; border-radius: 50%; background: var(--dusty); }
.wrap { text-align: center; padding: 28px 22px; }
.wrap p { max-width: 460px; margin: 0 auto; }
.actions { display: grid; gap: 10px; margin: 20px auto 0; max-width: 360px; }
.actions .btn, .actions .pill { width: 100%; }
.foot { text-align: center; font-family: var(--label); font-weight: 700; font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: var(--dusty); margin-top: 20px; }
.printhead { display: none; }

/* ---------- Larger screens ---------- */
@media (min-width: 700px) {
  .shell { padding: 40px 24px 56px; }
  .card { padding: 40px 44px; }
  .start { padding: 60px 56px 52px; }
  .q { padding: 44px 48px 30px; }
  .q h1 { font-size: 34px; }
  .opt { padding: 17px 20px; font-size: 17px; }
  .topbar { margin-bottom: 14px; }
  .rhead { padding: 52px 48px 44px; }
  .fix { padding: 44px 48px 40px; }
  .told { padding: 20px 24px; }
  .bundle { padding: 24px 26px 26px; }
  .tighten, .wrap { padding: 36px 48px; }
  .results { gap: 18px; }
  .actions { grid-template-columns: 1fr 1fr; max-width: 520px; }
  .actions .btn { grid-column: 1 / -1; }
  .stop .what { font-size: 16px; }
  .meter i { width: 18px; }
}

@media (prefers-reduced-motion: reduce) {
  .fade { animation: none; }
  .track i, .opt, .opt .dot::after { transition: none; }
}

/* ---------- Print / save as PDF ---------- */
@media print {
  @page { margin: 14mm; }
  body { background: #fff; font-size: 12.5pt; }
  .shell { display: block; padding: 0; min-height: 0; }
  .col, .col--wide { max-width: none; }
  .actions, .noprint { display: none !important; }
  .printhead { display: block; text-align: center; margin-bottom: 10px; font-family: var(--label); font-weight: 700; font-size: 9pt; letter-spacing: 2px; text-transform: uppercase; color: var(--slate); }
  .results { display: block; }
  .results > * { margin-bottom: 12px; }
  .card { break-inside: avoid; padding: 22px 26px; }
  .fix { break-inside: auto; }
  .told, .bundle, .steps li, .path li { break-inside: avoid; }
  * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .fade { animation: none; }
}
</style>

<script>
(function () {
  'use strict';

  /* =========================================================
     DATA. Scoring is deterministic: every answer adds 0 to 3
     "leak points" to one or more of the 12 leaks below.
     ========================================================= */

  var QUESTIONS = [
    { id: 'stage', area: 'First things first', q: "Where's your product right now?",
      opts: [
        { t: "It's live, with its own checkout link" },
        { t: "It's on Etsy or another marketplace", add: { PG3: 2 }, ev: "It's on Etsy or another marketplace.", flag: 'market' },

      ] },
    { id: 'asked', area: 'Your offer', q: "Has anyone ever asked you for help with this?",

        { t: "$100 or more", add: { PR1: 3 }, ev: "It's priced at $100 or more." }
      ] },
    { id: 'pricehow', area: 'Your price', q: "How did you land on that price?",
      opts: [
        { t: "On purpose. I picked a number a stranger can say yes to without thinking hard." },
        { t: "I looked at what other people charge", add: { PR2: 2 }, ev: "You priced it by looking at what other people charge." },
        { t: "I guessed", add: { PR2: 2 }, ev: "You guessed at the price." },

      ] },
    { id: 'five', area: 'Your page', q: "A total stranger lands on your sales page. Five seconds later, what does she know?",
      help: "This is the five-second test. Be honest!",
      opts: [

        { t: "What it is, but not who it's for or what to do next", add: { PG1: 2 }, ev: "A stranger can tell what it is, but not who it's for or what to do next." },
        { t: "Not much, if I'm honest", add: { PG1: 3 }, ev: "A stranger can't tell much from your page in five seconds." }
      ] },
    { id: 'look', area: 'Your page', q: "What does she see of the product itself?",
      opts: [
        { t: "A mockup that shows it off, on a page that looks put together" },
        { t: "A mockup, but the page around it looks thrown together", add: { PG4: 2 }, ev: "The page around your mockup looks thrown together." },
        { t: "A plain cover or a screenshot", add: { PG2: 2 }, ev: "She sees a plain cover or a screenshot." },
        { t: "No picture. Just words.", add: { PG2: 3, PG4: 1 }, ev: "There's no picture of the product on your page." }
      ] },
    { id: 'taps', area: 'Your page', q: "How many taps from your bio link to your buy button?",
      help: "Count them on your phone if you're not sure.",
      opts: [
        { t: "One. My link goes straight to the product." },

        { t: "I don't have a link up anywhere yet", add: { PG3: 3, T1: 1 }, ev: "You don't have a link up anywhere yet.", flag: 'nolink' }
      ] },
    { id: 'views', area: 'Your traffic', q: "About how many people have seen your sales page so far?",
      help: "Wherever you built your page, look for views or visits.",
      opts: [
        { t: "More than 200" },
        { t: "50 to 200", add: { T1: 1 }, ev: "Between 50 and 200 people have seen your page." },
        { t: "Fewer than 50", add: { T1: 3 }, ev: "Fewer than 50 people have seen your page.", flag: 'gate' },
        { t: "No idea", add: { T1: 2 }, ev: "You don't know how many people have seen your page." }
      ] },
    { id: 'posts', area: 'Your traffic', q: "In the last two weeks, how often did you post about it?",
      opts: [
        { t: "Most days" },
        { t: "A few times", add: { T1: 1 }, ev: "You posted about it a few times in the last two weeks." },
        { t: "Once or twice", add: { T1: 2 }, ev: "You posted about it once or twice in the last two weeks." },

  var ITEMS = {

  /* =========================================================
     SCORING
     ========================================================= */
  function score(answers) {
    var pts = {}, ev = {}, flags = {}, end = null, i;
    for (i = 0; i < ORDER.length; i++) { pts[ORDER[i]] = 0; ev[ORDER[i]] = []; }
    for (i = 0; i < QUESTIONS.length; i++) {
      var a = answers[QUESTIONS[i].id];
      if (a === undefined || a === null) continue;
      var o = QUESTIONS[i].opts[a];
      if (!o) continue;
      if (o.end) { end = o.end; break; }
      if (o.flag) flags[o.flag] = true;
      if (o.add) {
        for (var k in o.add) {
          if (Object.prototype.hasOwnProperty.call(o.add, k)) {
            pts[k] += o.add[k];
            if (o.ev) ev[k].push(o.ev);
          }
        }
      }
    }
    if (end) return { end: end, pts: pts, ev: ev, flags: flags, top: [], minor: [] };

    for (i = 0; i < ORDER.length; i++) if (pts[ORDER[i]] > 3) pts[ORDER[i]] = 3;
    /* A guessed price that already sits at $27 or less is not a leak. */
    if (flags.lowprice && pts.PR2 > 1) pts.PR2 = 1;

    var ranked = ORDER.slice().sort(function (x, y) {
      if (pts[y] !== pts[x]) return pts[y] - pts[x];
      return ORDER.indexOf(x) - ORDER.indexOf(y);
    });
    /* The gate: under 50 page views always comes first. */
    if (flags.gate) {
      ranked.splice(ranked.indexOf('T1'), 1);
      ranked.unshift('T1');
    }
    var top = [], minor = [];
    for (i = 0; i < ranked.length; i++) {
      if (pts[ranked[i]] < 2 || top.length >= 2) continue;
      /* Both price leaks share one fix, so only the first one is shown. */
      if (ranked[i] === 'PR2' && top.indexOf('PR1') > -1) continue;
      top.push(ranked[i]);
    }
    for (i = 0; i < ORDER.length; i++) if (pts[ORDER[i]] === 1) minor.push(ORDER[i]);

    var areas = [];
    for (i = 0; i < AREAS.length; i++) {
      var best = null, lvl = 0;
      for (var j = 0; j < ranked.length; j++) {
        if (AREAS[i].codes.indexOf(ranked[j]) > -1 && pts[ranked[j]] > lvl) { lvl = pts[ranked[j]]; best = ranked[j]; }
      }
      areas.push({ key: AREAS[i].key, name: AREAS[i].name, level: lvl, code: best,
        what: lvl === 0 ? AREAS[i].solid : RESULTS[best].short });
    }
    return { end: null, pts: pts, ev: ev, flags: flags, top: top, minor: minor, areas: areas };
  }

  /* PG3 changes its wording with what she told us. */
  function pg3(flags) {
    var body = ["Every extra tap loses people."], steps;
    if (flags.linklist) body[0] += " If she has to pick your product out of a list of links, a lot of them never make it to the buy button.";
    if (flags.nolink) body[0] += " And with no link up anywhere, she has nowhere to go at all.";
    if (flags.market) {
      body.push("On a marketplace she's one tap from somebody else's product, and the marketplace keeps the customer. Your own checkout page fixes both.");
      steps = [
        "Set up your own checkout page. Made to Sell, Module 2 walks you through it.",
        "Put ONE link in your bio, straight to that page. No list of links.",
        "Run your Before You Launch Checklist before you send anyone to it."
      ];
    } else {
      steps = [
        "Put ONE link in your bio, straight to your product page. No list of links.",
        "Buy it yourself on your phone, start to finish, and count the taps.",
        "Run your Before You Launch Checklist before you send anyone to it."
      ];
    }
    return { body: body, steps: steps };
  }

  function load() {

      if (!raw) return;
      var s = JSON.parse(raw);
      if (s && typeof s === 'object' && s.answers && typeof s.answers === 'object') {
        state.answers = s.answers;
        state.at = typeof s.at === 'number' ? s.at : -1;
        state.done = !!s.done;
      }
    } catch (e) { /* storage is off. The quiz still works, it just won't remember. */ }
  }
  function save() {
    try { window.localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
  }
  function reset() {
    state = { answers: {}, at: -1, done: false };

  }

    var html = '<section class="card fix">' +

  function resultsText() {
    var res = score(state.answers), L = [], i;
    function block(label, r, evidence) {
      L.push(label.toUpperCase() + ': ' + r.title);
      if (evidence && evidence.length) { L.push('What you told me:'); for (var e = 0; e < evidence.length; e++) L.push('  - ' + evidence[e]); }
      L.push('Your fix:');
      for (var s = 0; s < r.steps.length; s++) L.push('  ' + (s + 1) + '. ' + r.steps[s]);
      for (var k = 0; k < r.items.length; k++) {
        var it = ITEMS[r.items[k]];
        L.push('Open ' + (it.the ? 'the ' : 'your ') + it.name + (it.href ? ' (' + it.href + ')' : '') + '. ' + it.use);
      }
      L.push('');
    }
    L.push('WHY ISN’T IT SELLING? My results'); L.push('');
    if (res.end) {
      block('Do this first', RESULTS[res.end], null);
    } else {
      for (i = 0; i < res.areas.length; i++) L.push(res.areas[i].name + ': ' + LEVELS[res.areas[i].level] + '. ' + res.areas[i].what);
      L.push('');
      if (!res.top.length) {
        block('What to do now', RESULTS.OK, null);
        if (res.minor.length) { L.push('Small things to tighten:'); for (i = 0; i < res.minor.length; i++) L.push('  - ' + RESULTS[res.minor[i]].tighten); L.push(''); }
      } else {
        for (i = 0; i < res.top.length; i++) block(i === 0 ? 'Fix this first' : 'Then fix this', resolved(res.top[i], res), res.ev[res.top[i]]);
      }
    }
    L.push('Simple Creator Co.');
    return L.join('\n').replace(/[“”]/g, '"').replace(/’/g, "'");
  }

  function copyText(text, done) {
    function fallback() {
      var ta = document.createElement('textarea');
      ta.value = text; ta.setAttribute('readonly', '');
      ta.style.position = 'fixed'; ta.style.top = '0'; ta.style.left = '0'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.focus(); ta.select();
      try { ta.setSelectionRange(0, text.length); } catch (e) {}
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
      document.body.removeChild(ta);
      done(ok);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { done(true); }, fallback);
    } else { fallback(); }
  }

  function render() {
    if (state.done) return renderResults();
    if (state.at < 0) return renderStart();
    renderQuestion();
  }

  var busy = false;
  function advance() {
    var q = QUESTIONS[state.at], o = q.opts[state.answers[q.id]];
    if ((o && o.end) || state.at >= QUESTIONS.length - 1) { state.done = true; }
    else { state.at += 1; }
    save(); render();
  }

  app.addEventListener('click', function (ev) {
    var el = ev.target.closest ? ev.target.closest('[data-act]') : null;
    if (!el || busy) return;
    var act = el.getAttribute('data-act');
    if (act === 'begin') { state.at = 0; save(); render(); }
    else if (act === 'pick') {
      var q = QUESTIONS[state.at], idx = parseInt(el.getAttribute('data-i'), 10);
      state.answers[q.id] = idx;
      var all = app.querySelectorAll('.opt');
      for (var i = 0; i < all.length; i++) all[i].setAttribute('aria-pressed', i === idx ? 'true' : 'false');
      save(); busy = true;
      window.setTimeout(function () { busy = false; advance(); }, 240);
    }
    else if (act === 'next') { advance(); }
    else if (act === 'back') { state.at -= 1; save(); render(); }
    else if (act === 'print') { window.print(); }
    else if (act === 'copy') {
      copyText(resultsText(), function (ok) {
        el.textContent = ok ? 'Copied!' : 'Couldn’t copy. Try save or print.';
        window.setTimeout(function () { el.textContent = 'Copy as text'; }, 2600);
      });
    }
    else if (act === 'restart') { reset(); render(); }
  });

  /* For testing and support: the scoring function, with no side effects. */
  window.SCC_DIAGNOSE = { score: score, questions: QUESTIONS, order: ORDER };

  load();
  if (!state.done && (state.at >= QUESTIONS.length || (state.at >= 0 && !QUESTIONS[state.at]))) reset();
  render();
})();
</script>
